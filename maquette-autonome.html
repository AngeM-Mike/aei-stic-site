<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AEI STIC — Maquette du site</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff;--ink:#2b1512;--mut:#75666a;--soft:#f5f3f3;--line:rgba(43,21,18,.1);--coral:#4aa8ff;--peach:#a9dcff;--tint:#e3f2ff;--grad:linear-gradient(135deg,#4aa8ff,#1f7aea);--dark:#2b1512;--sh:0 14px 36px rgba(43,21,18,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.65 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:Sora,Inter,sans-serif;line-height:1.12;margin:0;letter-spacing:-.025em}
h1{font-size:clamp(2.2rem,5vw,3.8rem);font-weight:700}h2{font-size:clamp(1.6rem,3vw,2.3rem);font-weight:600}h3{font-size:1.08rem;font-weight:600}
p{margin:0;max-width:60ch}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--coral);outline-offset:3px}
.wrap{width:min(1120px,100% - 40px);margin:0 auto}
.mark{background:var(--tint);padding:0 .2em;border-radius:.28em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sub{color:var(--mut)}.c{text-align:center;justify-items:center}
nav{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:7px 8px 7px 12px;border-radius:99px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:9px;font:700 .95rem Sora;background:none;border:0;padding:0 10px 0 0}.brand img{width:34px;height:34px;border-radius:50%}
.links{display:flex;gap:2px}.links button{background:none;border:0;padding:9px 15px;border-radius:99px;font-size:.88rem;font-weight:500;color:var(--mut);transition:.25s}
.links button:hover{color:var(--ink)}.links button.on{background:var(--ink);color:#fff}
.burger{display:none;background:var(--soft);border:0;border-radius:99px;width:40px;height:40px}
@media(max-width:860px){.burger{display:block}.links{position:absolute;top:62px;left:20px;right:20px;flex-direction:column;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);border-radius:22px;padding:8px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:.25s}.links.open{opacity:1;visibility:visible;transform:none}.links button{text-align:left}.pill{justify-content:space-between;width:calc(100% - 40px)}}
main{padding-top:100px}
.page{animation:fade .45s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
section{padding:40px 0}
.head{margin-bottom:28px;display:grid;gap:10px}
.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:3px 11px;border-radius:99px;background:var(--tint);color:#5b3a31;width:fit-content}
.btn{display:inline-flex;align-items:center;gap:10px;padding:8px 8px 8px 22px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:.92rem;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.btn .ar{width:34px;height:34px;border-radius:50%;background:var(--grad);color:var(--ink);display:grid;place-items:center}
.btn.p{background:var(--ink);color:#fff;border:0}.btn.g{background:var(--grad);color:var(--ink);border:0}.btn.g .ar{background:var(--ink);color:#fff}
.btn.o{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .65s ease,transform .65s ease}.reveal.in{opacity:1;transform:none}
/* cadres photo */
.pic{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(135deg,#f4ece9,#fbe6da);width:100%}
.pic::before{content:"";position:absolute;inset:10px;border:2px dashed rgba(238,127,134,.45);border-radius:16px;pointer-events:none;z-index:1}
.pic svg.mo{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;transition:transform .8s ease}
.pic.has::before{display:none}
.ph{position:absolute;left:18px;top:18px;z-index:3;display:flex;align-items:center;gap:7px;background:#fff;border-radius:99px;padding:5px 12px 5px 9px;font-size:.72rem;font-weight:600;box-shadow:0 4px 14px rgba(43,21,18,.08);max-width:calc(100% - 36px)}
.ph span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ph svg{flex:none;color:var(--coral)}
.zoom:hover .pic img{transform:scale(1.05)}
.fill{height:100%;min-height:260px}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:20px 0 10px}
.hero .txt{display:grid;gap:24px}
.hp{position:relative}
.chip{position:absolute;z-index:5;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:var(--sh);display:flex;align-items:center;gap:12px;font-size:.84rem;animation:bob 7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.chip b{display:block;font:600 .95rem Sora}.chip i{width:38px;height:38px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-style:normal}
.chip.a{left:-26px;top:46px}.chip.b{right:14px;bottom:-16px;animation-delay:-3s}
@media(max-width:860px){.hero{grid-template-columns:1fr}.chip.a{left:8px}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:34px}
.stat{text-align:center;padding:8px 16px;border-right:1px solid var(--line)}.stat:last-child{border:0}
.stat b{display:block;font:700 clamp(2rem,4.5vw,3.2rem)/1.1 Sora}.stat span{font-size:.88rem;color:var(--mut)}
/* bande photo */
.band{position:relative;border-radius:36px;overflow:hidden;padding:clamp(32px,6vw,70px) clamp(16px,4vw,50px);display:grid;gap:30px;justify-items:center;text-align:center;color:#fff;isolation:isolate}
.band>.pic{position:absolute;inset:0;border-radius:0;z-index:-2;height:100%}.band::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(43,21,18,.35),rgba(43,21,18,.65));z-index:-1}
.band h2{color:#fff}.band .sub{color:rgba(255,255,255,.85)}
.wc{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;text-align:left;margin-top:30px}
.wcd{background:#fff;color:var(--ink);border-radius:26px;padding:24px;display:grid;gap:10px;align-content:start}
.wcd .ic{width:48px;height:48px;border-radius:50%;background:var(--grad);display:grid;place-items:center}
.wcd .btn{justify-self:start;margin-top:6px;padding:6px 6px 6px 16px;font-size:.84rem}.wcd .ar{width:28px;height:28px}
@media(max-width:860px){.wc{grid-template-columns:1fr}}
/* carte grise */
.gcard{background:linear-gradient(135deg,#f7f6f6,#ebe9e9);border-radius:36px;padding:clamp(22px,4vw,44px);display:grid;grid-template-columns:.8fr 1.2fr;gap:36px;align-items:center}
.gcard .pic{aspect-ratio:4/5}.play{position:absolute;left:14px;bottom:14px;z-index:4;width:48px;height:48px;border-radius:50%;background:var(--grad);display:grid;place-items:center;border:0;box-shadow:var(--sh)}
.gcard ul{list-style:none;padding:0;margin:14px 0 22px;display:grid;gap:10px}.gcard li{display:flex;gap:10px;align-items:center}.gcard li i{width:26px;height:26px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none}
@media(max-width:760px){.gcard{grid-template-columns:1fr}}
/* cartes photo */
.pc{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:3/4;display:block;width:100%;border:0;padding:0;text-align:left;background:var(--soft)}
.pc .pic{position:absolute;inset:0;height:100%;border-radius:0}
.lab{position:absolute;left:10px;right:10px;bottom:10px;z-index:5;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:20px;padding:12px 12px 12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.lab small{display:block;font-size:.7rem;color:var(--mut)}.lab b{font:600 1rem Sora}
.lab i{width:36px;height:36px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none;transition:transform .3s}.pc:hover .lab i{transform:rotate(45deg)}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}.row4>:nth-child(even){margin-top:28px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:960px){.row4{grid-template-columns:1fr 1fr}}@media(max-width:760px){.row3{grid-template-columns:1fr}.row4{grid-template-columns:1fr}.row4>:nth-child(even){margin-top:0}}
/* cta sombre */
.dcta{background:var(--dark);color:#fff;border-radius:40px;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:clamp(26px,5vw,56px);overflow:hidden}
.dcta h2{color:#fff;margin-bottom:12px}.dcta p{color:rgba(255,255,255,.7);margin-bottom:22px}
.mc{background:var(--grad);color:var(--ink);border-radius:26px;padding:22px;aspect-ratio:1.6;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 24px 50px rgba(0,0,0,.35);transform:rotate(-3deg)}
.mc img{width:44px;height:44px;border-radius:50%}.mc div{display:flex;justify-content:space-between;align-items:flex-start;font:600 .8rem Sora}
@media(max-width:760px){.dcta{grid-template-columns:1fr;border-radius:30px}}
/* onglets & accordéons */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:10px 20px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:500;transition:.25s}.tab:hover{border-color:var(--coral)}.tab.on{background:var(--ink);color:#fff;border-color:transparent}
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:30px;align-items:start}
@media(max-width:760px){.split{grid-template-columns:1fr}}
.vt{display:grid;gap:4px;border-left:2px solid var(--line)}
.vt button{background:none;border:0;border-left:3px solid transparent;margin-left:-2px;text-align:left;padding:14px 20px;transition:.3s}
.vt button h3{font-size:1.5rem;color:#b3b0af;transition:color .3s}.vt button.on{border-color:var(--ink)}.vt button.on h3{color:var(--ink)}
.vt .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s}.vt button.on .bd{grid-template-rows:1fr}.vt .bd>div{overflow:hidden}.vt .bd p{padding-top:8px;font-size:.92rem;color:var(--mut)}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tg span{background:var(--soft);font-size:.78rem;padding:3px 11px;border-radius:99px;color:var(--ink)}
.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:200px 200px;gap:12px;animation:fade .45s ease both}.mosaic .pic{height:100%}.mosaic .t{grid-row:span 2;grid-column:2}
@media(max-width:560px){.mosaic{grid-template-rows:150px 150px}}
.acc{background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;transition:border-color .3s}.acc.open{border-color:var(--coral)}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:20px 24px;background:none;border:0;text-align:left;font:600 1.05rem Sora}
.pl{width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;transition:.3s;flex:none}.acc.open .pl{transform:rotate(45deg);background:var(--grad)}
.ab{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s}.acc.open .ab{grid-template-rows:1fr}.ab>div{overflow:hidden}.ab p{padding:0 24px 22px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:s}.steps div{padding:24px;border-radius:26px;background:var(--soft)}
.steps div::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--grad);font:700 .95rem Sora;margin-bottom:12px}
@media(max-width:860px){.steps{grid-template-columns:1fr 1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:10px;display:flex;flex-direction:column;gap:12px;text-align:left;transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh)}.card.sel{border-color:var(--coral);box-shadow:var(--sh)}.card .tx{padding:2px 14px 14px;display:grid;gap:6px}
.box{background:var(--soft);border-radius:30px;padding:clamp(22px,4vw,36px);display:grid;gap:12px;align-content:start}
.box ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:8px}.box li{background:#fff;border-radius:16px;padding:11px 16px;font-size:.93rem}
.frame{background:#fff;border:1px solid var(--line);border-radius:28px;padding:10px;box-shadow:var(--sh);animation:fade .5s ease both}
.frame .tx{padding:16px 12px 12px;display:grid;gap:6px}.frame time{font-size:.8rem;font-weight:600;color:#c4606a}
/* footer */
footer{margin-top:110px;position:relative}
.foot{background:var(--dark);color:#fff;border-radius:56px 56px 0 0;padding:90px clamp(24px,5vw,64px) 28px;position:relative}
.foot .lg{z-index:2;position:absolute;top:-52px;left:50%;transform:translateX(-50%);width:104px;height:104px;border-radius:50%;border:8px solid #fff;background:var(--dark)}
.foot .mo{position:absolute;inset:0;width:100%;height:100%;opacity:.07;pointer-events:none;clip-path:inset(0 round 56px 56px 0 0)}
.fg{position:relative;display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:34px;align-items:start}
.foot h4{font-size:1.15rem;margin-bottom:12px;color:var(--peach)}
.foot a,.foot li{display:flex;align-items:center;gap:10px;font-size:.92rem;color:rgba(255,255,255,.85);padding:3px 0}.foot a:hover{color:#fff;text-decoration:underline}
.foot ul{list-style:none;margin:0;padding:0}.foot li svg,.foot a svg{color:var(--coral);flex:none}
.soc{display:grid;gap:4px;margin-top:18px}.soc a{justify-content:space-between;max-width:190px;border-bottom:1px solid rgba(255,255,255,.12)}
.fc{text-align:center;display:grid;gap:16px;justify-items:center}.fc h3{font-size:2rem;color:#fff}.fc em{font:italic 1.1rem Georgia,serif;color:var(--peach)}
.fc .cta{justify-content:center}
.ql{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.fb{position:relative;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:42px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);font-size:.8rem;color:rgba(255,255,255,.6)}
.lp{display:flex;gap:16px;background:var(--tint);color:var(--ink);border-radius:10px;padding:7px 14px;font-weight:500}.lp a{color:var(--ink);padding:0;font-size:.8rem}
@media(max-width:860px){.fg{grid-template-columns:1fr}.fc{order:-1}.foot{border-radius:40px 40px 0 0}}
.prog{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--grad);z-index:40}
nav .pill{transition:box-shadow .3s}body.sc nav .pill{box-shadow:0 8px 28px rgba(43,21,18,.16)}
.btn .ar{transition:transform .25s}.btn:hover .ar{transform:translateX(3px)}
.wd{display:inline-block;opacity:0;transform:translateY(.45em);animation:wd .75s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes wd{to{opacity:1;transform:none}}
.reveal .pic{clip-path:inset(0 0 100% 0);transition:clip-path 1s cubic-bezier(.2,.7,.2,1)}.reveal.in .pic{clip-path:inset(0)}
.card,.frame,.gcard,.box,.steps>div,.acc,.wcd{position:relative}
.card::after,.frame::after,.gcard::after,.box::after,.steps>div::after,.acc::after,.wcd::after,.pc::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:6;opacity:0;transition:opacity .35s;background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),rgba(238,127,134,.14),transparent 65%)}
.card:hover::after,.frame:hover::after,.gcard:hover::after,.box:hover::after,.steps>div:hover::after,.acc:hover::after,.wcd:hover::after,.pc:hover::after{opacity:1}
.btn{will-change:transform}
.st{font:600 clamp(1.6rem,3.6vw,2.8rem)/1.25 Sora;letter-spacing:-.02em;max-width:24em;margin:0 auto;text-align:center}
.st span{color:#dde5ec;transition:color .35s}.st span.on{color:var(--ink)}
.eco{overflow:hidden;padding:6px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.eco>div{display:flex;width:max-content;animation:mq 42s linear infinite}.eco:hover>div{animation-play-state:paused}
.eco>div>span{display:flex;gap:18px;padding-right:18px}
.et{width:176px;height:176px;flex:none;border-radius:26px;background:var(--dark);color:#fff;display:grid;place-content:center;justify-items:center;gap:5px;text-align:center;padding:14px;transition:transform .35s}
.et:hover{transform:translateY(-6px)}.et img{width:54px;height:54px;border-radius:50%}.et b{font:700 1.3rem Sora;color:var(--peach)}.et small{font-size:.72rem;opacity:.7;line-height:1.35}
@keyframes mq{to{transform:translateX(-50%)}}
.curtain{position:fixed;inset:0;z-index:60;background:var(--dark);display:grid;place-items:center;pointer-events:none;transform:translateY(101%)}
.curtain img{width:76px;height:76px;border-radius:50%;opacity:0}
.curtain.in{animation:cin .46s cubic-bezier(.7,0,.2,1) forwards;pointer-events:auto}.curtain.in img{animation:lg .35s .22s ease forwards}
.curtain.out{transform:none;animation:cout .55s cubic-bezier(.7,0,.2,1) forwards}.curtain.out img{opacity:1}
@keyframes cin{from{transform:translateY(101%)}to{transform:none}}@keyframes cout{from{transform:none}to{transform:translateY(-101%)}}@keyframes lg{to{opacity:1}}
.more{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.86rem;margin-top:8px}
.more i{width:28px;height:28px;border-radius:50%;background:var(--grad);display:grid;place-items:center;transition:transform .3s}.frame:hover .more i{transform:rotate(45deg)}
.ov{position:fixed;inset:0;z-index:55;background:rgba(43,21,18,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-end;padding-top:env(safe-area-inset-top,0px);animation:ovin .35s ease both}
.sheet{background:#fff;width:min(860px,100%);max-height:94vh;overflow:auto;border-radius:36px 36px 0 0;padding:clamp(16px,4vw,36px) clamp(16px,4vw,40px) calc(28px + env(safe-area-inset-bottom,0px));position:relative;outline:none;animation:sh .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes ovin{from{opacity:0}}@keyframes sh{from{transform:translateY(60px);opacity:0}}
.x{position:absolute;top:26px;right:26px;z-index:9;width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:var(--sh)}
.meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0 10px}.meta time{font-size:.85rem;font-weight:600;color:#c4606a}
.sheet p{margin-top:14px;font-size:1.02rem}.nv{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
/* ===== Règles de couleur : marron/blanc/bleu, jamais bleu sur marron ni marron sur bleu ===== */
:root{--blue:#2b84f0;--blue2:#1a6fd6;--bsoft:#eef6ff;--brown:#2b1512;--bgrad:linear-gradient(135deg,#4aa8ff,#1f7aea);--brn:linear-gradient(160deg,#402419 0%,#2b1512 52%,#1b0e0c 100%)}
.prog{background:linear-gradient(90deg,#4aa8ff,#1f7aea)}
.links button.on{background:var(--bgrad);color:#fff}
.badge{background:var(--bsoft);color:var(--blue2)}.badge.warm{background:#f1e9e6;color:#5b3a31}
.mark{background:var(--bgrad);color:#fff;padding:.02em .22em}
.btn .ar{background:var(--bgrad);color:#fff}
.btn.p{background:var(--brown);color:#fff}.btn.p .ar{background:#fff;color:var(--ink)}
.btn.g{background:#fff;color:var(--ink);border:0}.btn.g .ar{background:var(--brown);color:#fff}
.tab.on{background:var(--brown);color:#fff}.tab:hover{border-color:var(--blue)}
.chip i,.lab i,.more i{background:var(--bgrad);color:#fff}
.vt button.on{border-color:var(--blue)}
.stat b{background:linear-gradient(135deg,#2b1512 25%,#1f7aea);-webkit-background-clip:text;background-clip:text;color:transparent}
.frame time,.meta time{color:var(--blue2)}
.hero{position:relative;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-30px -60px;z-index:-1;background-image:linear-gradient(rgba(74,168,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(74,168,255,.14) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(60% 75% at 65% 45%,#000,transparent);mask-image:radial-gradient(60% 75% at 65% 45%,#000,transparent)}
.hp{isolation:isolate}
.hp::before{content:"";position:absolute;inset:6% -10% -8% 12%;background:radial-gradient(closest-side,rgba(74,168,255,.42),rgba(74,168,255,.1) 60%,transparent);filter:blur(28px);z-index:-1;animation:drift 14s ease-in-out infinite}
@keyframes drift{50%{transform:translate(-3%,3%) scale(1.06)}}
.chip.code{display:block;left:-34px;bottom:84px;background:var(--brn);color:#fff;font:500 .78rem/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:nowrap;animation-delay:-5s}
.code .k{color:#fff;font-weight:600}.code .s{color:rgba(255,255,255,.7)}
@media(max-width:860px){.chip.code{left:8px;bottom:70px}}
/* cartes : brun, bleu, une blanche sur quatre */
.kb{background:var(--brn);color:#fff;border-color:transparent}
.kl{background:var(--bgrad);color:#fff;border-color:transparent}
.kw{background:#fff;color:var(--ink)}
.kb .sub,.kl .sub{color:rgba(255,255,255,.82)}
.kb .badge,.kl .badge{background:rgba(255,255,255,.18);color:#fff}
.kb time,.kl time{color:rgba(255,255,255,.85)}
.kb .more i{background:#fff;color:var(--ink)}.kl .more i{background:#fff;color:var(--blue2)}
.acc.kb .pl{background:#fff;color:var(--ink)}.acc.kl .pl{background:#fff;color:var(--blue2)}.acc.kw .pl{background:var(--bgrad);color:#fff}
.acc.open{border-color:transparent}
.card.sel{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--blue)}
.card::after,.frame::after,.gcard::after,.box::after,.steps>div::after,.acc::after,.wcd::after,.pc::after{background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.14),transparent 65%)}
.kw::after{background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),rgba(74,168,255,.14),transparent 65%)}
.box{background:var(--brn);color:#fff}.box .sub{color:rgba(255,255,255,.82)}.box li{background:rgba(255,255,255,.12);color:#fff}
.steps div:nth-child(1),.steps div:nth-child(3){background:var(--brn);color:#fff}
.steps div:nth-child(2){background:var(--bgrad);color:#fff}
.steps div:nth-child(4){background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.steps div:nth-child(-n+3) .sub{color:rgba(255,255,255,.85)}
.steps div::before{background:var(--bgrad);color:#fff}
.steps div:nth-child(1)::before,.steps div:nth-child(3)::before{background:#fff;color:var(--ink)}.steps div:nth-child(2)::before{background:#fff;color:var(--blue2)}
.band::after{background:linear-gradient(160deg,rgba(27,14,12,.84),rgba(43,21,18,.55) 55%,rgba(27,14,12,.88))}
.wcd.kw .sub{color:var(--mut)}.wcd.kb .sub,.wcd.kl .sub{color:rgba(255,255,255,.85)}
.wcd.kb{box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.wcd.kb .ic{background:#fff;color:var(--ink)}.wcd.kl .ic{background:#fff;color:var(--blue2)}.wcd.kw .ic{background:var(--bgrad);color:#fff}
.wcd.kb .btn.p,.wcd.kl .btn.p{background:#fff;color:var(--ink)}.wcd.kb .btn.p .ar{background:var(--brown);color:#fff}.wcd.kl .btn.p .ar{background:var(--bgrad);color:#fff}
.gcard{background:var(--brn);color:#fff}.gcard .sub{color:rgba(255,255,255,.82)}.gcard li i{background:#fff;color:var(--ink)}
.gcard .btn.p{background:#fff;color:var(--ink)}.gcard .btn.p .ar{background:var(--brown);color:#fff}
.play{background:var(--bgrad);color:#fff}
.dcta{background:radial-gradient(60% 100% at 95% 0%,rgba(120,72,55,.5),transparent 60%),var(--brn)}
.mc{background:#fff;color:var(--ink);box-shadow:inset 0 10px 0 #2b84f0,0 24px 50px rgba(0,0,0,.35)}
.et{background:var(--brn);color:#fff}.et b{color:#fff}.et small{opacity:.8}
.et:nth-child(2),.et:nth-child(6){background:var(--bgrad)}
.et:nth-child(4){background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}.et:nth-child(4) b{color:var(--ink)}
.pic{background:linear-gradient(135deg,#eaf5ff,#f7f5f4 55%,#dcedff)}.pic::before{border-color:rgba(43,132,240,.5)}.ph svg{color:var(--blue2)}
.pic .mo g:first-child{stroke:#4aa8ff}.pic .mo g:last-child{fill:#4aa8ff}
.curtain{background:var(--brn)}
.foot{background:var(--brn)}.foot .lg{background:var(--brown)}
.foot h4,.fc em{color:#fff}.fc em{opacity:.85}
.foot li svg,.foot a svg{color:#fff}
.lp{background:#fff;color:var(--ink)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}.wd{opacity:1;transform:none}.reveal .pic{clip-path:none}}
</style>

function Reveal({children,className="",as:T="div",delay=0,...rest}){
  const r=useRef();const [v,setV]=useState(false);
  useEffect(()=>{const io=new IntersectionObserver(([e])=>{if(e.isIntersecting){setV(true);io.disconnect()}},{threshold:.1});io.observe(r.current);return()=>io.disconnect()},[]);
  return <T ref={r} className={"reveal"+(v?" in ":" ")+className} style={{transitionDelay:delay+"ms"}} {...rest}>{children}</T>;
}
function Count({to}){
  const [n,setN]=useState(0);const r=useRef();
  useEffect(()=>{const io=new IntersectionObserver(([e])=>{if(!e.isIntersecting)return;io.disconnect();const t0=performance.now();const f=t=>{const p=Math.min((t-t0)/1100,1);setN(Math.round(to*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)});io.observe(r.current);return()=>io.disconnect()},[to]);
  return <b ref={r}>{n}</b>;
}

const Statement=({t})=>{

  return <p ref={r} className="st" aria-label={t}>{w.map((x,i)=><span key={i} className={i<k?"on":""} aria-hidden="true">{x} </span>)}</p>;
};

function Stic(){

    </div>
    <section><Head t="L’AEI-STIC" s="Une association étudiante liée à la filière, qui valorise ce que font les élèves-ingénieurs."/>
      <div className="row3">{[["Valoriser les projets","Faire connaître les projets d’étude, d’application et professionnels, de l’idée à la soutenance.","mission-projets","Présentation d’un projet"],["Valoriser les talents","Mettre en lumière les compétences, parcours et réalisations des étudiants.","mission-talents","Portrait d’un étudiant"],["Communiquer sur la filière","Présenter la formation, ses domaines et ses débouchés par des contenus accessibles.","mission-com","Création de contenus"]].map(([t,d,id,cap],n)=><Reveal key={t} delay={n*80} className={"card "+["kb","kl","kb","kw"][n%4]}><Pic id={id} cap={cap} r="4/3"/><div className="tx"><h3>{t}</h3><p className="sub" style={{fontSize:".92rem"}}>{d}</p></div></Reveal>)}</div>
    </section>
  </div>;
}

      <Pic id={"asso-detail-"+(s+1)} r="16/10" cap={"Événement de "+A[s][0]}/></div>

const ART={"2025-09-01":["À l’occasion de la rentrée, l’AEI STIC a adressé un message collectif à l’ensemble des élèves-ingénieurs de la filière.","Il met en avant la réussite, les découvertes, les opportunités et les projets qui attendent les étudiants au fil de l’année."],"2025-09-26":["Dans ce portrait, l’AEI STIC met en lumière le parcours d’un diplômé de la filière : Roméo Bomisso, diplômé MIS 2007 et aujourd’hui dirigeant dans le secteur des assurances.","Ce type de contenu aide les étudiants à se projeter dans leur future carrière et à découvrir les débouchés de la filière."],"2025-10-01":["« Focus sur la STIC » présente les spécialités de la filière, les matières enseignées et les débouchés associés.","Informatique, télécommunications et EIT : chaque domaine est expliqué avec des mots accessibles, pour aider les futurs étudiants et le grand public à comprendre la formation."],"2025-10-21":["L’AEI STIC met en valeur les UP-PRO, c’est-à-dire les projets d’étude, d’application et professionnels des élèves-ingénieurs STIC.","L’idée est de suivre ces projets de l’idée initiale jusqu’à la soutenance, et de faire connaître le travail des étudiants."],"2026-01-01":["Pour ouvrir l’année 2026, l’AEI STIC a partagé un message collectif de vœux.","Il évoque les opportunités, les projets et la réussite que chacun peut construire dans les mois à venir."],"2026-09-05":["La journée d’intégration de l’ESI était prévue le 5 septembre 2026 pour les nouveaux élèves-ingénieurs de première année et les techniciens supérieurs de première année.","Les élèves de deuxième année ingénieur et de TS2 participaient à l’organisation : protocole et accueil des invités, animation et sonorisation. Une cotisation de 1 000 FCFA par personne avait été indiquée.","Ce texte décrit le programme prévu. Il reste à le compléter avec le déroulé réel et les photos de la journée."],"2026-10-01":["En octobre 2026, l’AEI STIC s’associe à Octobre Rose pour sensibiliser au cancer du sein.","Le message rappelle l’importance de la prévention et du soutien aux personnes concernées."]};
const Article=({e,L,onClose,onNav})=>{
  const ref=useRef();
  useEffect(()=>{const o=document.body.style.overflow;document.body.style.overflow="hidden";ref.current.focus();const k=ev=>{if(ev.key==="Escape")onClose()};addEventListener("keydown",k);return()=>{document.body.style.overflow=o;removeEventListener("keydown",k)}},[]);
  const i=L.findIndex(x=>x[0]===e[0]),older=L[i+1],newer=L[i-1];
  return ReactDOM.createPortal(<div className="ov" onClick={onClose}><article className="sheet" ref={ref} tabIndex={-1} role="dialog" aria-modal="true" aria-label={e[2]} onClick={ev=>ev.stopPropagation()}>
    <button className="x" onClick={onClose} aria-label="Fermer l’article">✕</button>
    <Pic id={"act-"+e[0]} cap={e[5]} r="16/9"/>
    <div className="meta"><span className="badge">{e[4]}</span><time>{e[1]}</time></div>
    <h2>{e[2]}</h2>{ART[e[0]].map((p,j)=><p key={j}>{p}</p>)}
    <span className="badge warm" style={{marginTop:22}}>Article provisoire à compléter</span>
    <div className="nv">{older?<button className="btn" onClick={()=>onNav(older[0])}>Plus ancien : {older[2]}<Ar/></button>:<span/>}{newer?<button className="btn" onClick={()=>onNav(newer[0])}>Plus récent : {newer[2]}<Ar/></button>:<button className="btn p" onClick={onClose}>Retour aux activités<Ar/></button>}</div>
  </article></div>,document.body);
};

function Activites(){
  const E=[["2025-09-01","1er septembre 2025","Message de rentrée","Un message collectif autour de la réussite et des découvertes.","Communication","Visuel de rentrée"],["2025-09-26","26 septembre 2025","Portrait de Roméo Bomisso","Parcours d’un diplômé MIS 2007, dirigeant dans le secteur des assurances.","Communication","Portrait de l’invité"],["2025-10-01","1er octobre 2025","Focus sur la STIC","Présentation des spécialités, des matières et des débouchés de la filière.","Communication","Visuel Focus STIC"],["2025-10-21","21 octobre 2025","Mise en valeur des UP-PRO","Les projets d’étude, d’application et professionnels des élèves-ingénieurs.","Projets","Présentation d’un projet"],["2026-01-01","1er janvier 2026","Message de nouvelle année","Vœux collectifs autour des opportunités et des projets.","Communication","Visuel de vœux"],["2026-09-05","5 septembre 2026","Journée d’intégration ESI","Accueil des nouveaux élèves-ingénieurs et techniciens supérieurs de première année.","Événement","Photo de la journée"],["2026-10-01","Octobre 2026","Octobre Rose","Sensibilisation au cancer du sein, à la prévention et au soutien.","Sensibilisation","Visuel Octobre Rose"]];
  const C=["Tous","Communication","Projets","Événement","Sensibilisation"];
  const [f,setF]=useState("Tous");
  const L=E.filter(e=>f==="Tous"||e[4]===f).reverse();
  const [op,setOp]=useState(null);
  return <div className="page wrap">
    <Head t="Activités" s="Les temps forts de l’association, du plus récent au plus ancien."/>
    <div className="tabs">{C.map(c=><button key={c} className={"tab"+(f===c?" on":"")} onClick={()=>setF(c)}>{c}</button>)}</div>
    <div className="row3">{L.map((e,i)=><article className={"frame zoom "+["kb","kl","kb","kw"][i%4]} role="button" tabIndex={0} aria-label={"Lire l’article : "+e[2]} onClick={()=>setOp(e[0])} onKeyDown={ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();setOp(e[0])}}} key={e[0]+f} style={{animationDelay:i*60+"ms",cursor:"pointer"}}><Pic id={"act-"+e[0]} cap={e[5]} r="4/3"/><div className="tx"><time>{e[1]}</time><h3>{e[2]}</h3><p className="sub" style={{fontSize:".9rem"}}>{e[3]}</p><span className="badge" style={{marginTop:4}}>{e[4]}</span><span className="more">Lire l’article<i><Ic n="arr" s={14}/></i></span></div></article>)}</div>
    {op&&<Article key={op} e={E.find(x=>x[0]===op)} L={L} onClose={()=>setOp(null)} onNav={setOp}/>}
  </div>;
}

function Footer({go}){
  const nop=e=>e.preventDefault();
  return <footer><div className="wrap" style={{width:"min(1240px,100%)"}}><div className="foot">
    <img className="lg" src={LOGO} alt="Logo AEI STIC"/>
    <svg className="mo" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g stroke="#fff" strokeWidth="2" fill="none"><path d="M0 300H200L250 350H500"/><path d="M800 80H600L550 30H400"/><path d="M0 100H120L170 50"/><path d="M800 330H680L640 290"/></g></svg>
    <div className="fg">
      <div><h4>Contact</h4><ul><li><Ic n="pin" s={18}/>ESI, INP-HB, Yamoussoukro, Côte d’Ivoire</li><li><Ic n="phone" s={18}/>+225 00 00 00 00 00</li><li><Ic n="mail" s={18}/>contact@aeistic.exemple</li></ul>
        <div className="soc">{[["fb","Facebook"],["ig","Instagram"],["in","LinkedIn"]].map(([i,l])=><a key={l} href="#" onClick={nop}><span style={{display:"flex",gap:10,alignItems:"center"}}><Ic n={i} s={16}/>{l}</span><Ic n="arr" s={14}/></a>)}<a href="https://linktr.ee/link.aeistic" target="_blank" rel="noopener"><span style={{display:"flex",gap:10,alignItems:"center"}}><Ic n="tree" s={16}/>Linktree</span><Ic n="arr" s={14}/></a></div></div>
      <div className="fc"><h3>AEI STIC</h3><em>Projets, talents, créativité</em><div className="cta"><button className="btn g" onClick={()=>go("stic")}>Découvrir la STIC<Ar/></button><button className="btn o" onClick={()=>go("je")}>La Junior Entreprise</button></div></div>
      <div><h4>Accès rapide</h4><div className="ql">{PAGES.map(([k,l])=><a key={k} href={"#"+k} onClick={e=>{e.preventDefault();go(k)}}>{l}</a>)}<a href="#" onClick={nop}>Contact</a></div></div>
    </div>
    <div className="fb"><span>Maquette v1 · coordonnées et liens d’exemple, photos à ajouter</span><div className="lp"><a href="#" onClick={nop}>Mentions légales</a><a href="#" onClick={nop}>Confidentialité</a><span>© 2026</span></div></div>
  </div></div></footer>;
}

function App(){
  const init=()=>{try{const h=location.hash.slice(1);return PAGES.some(p=>p[0]===h)?h:"accueil"}catch(e){return "accueil"}};
  const [page,setPage]=useState(init);
  const [cu,setCu]=useState("");
  const go=k=>{if(k===page)return window.scrollTo({top:0,behavior:"smooth"});const sw=()=>{setPage(k);try{location.hash=k}catch(e){}window.scrollTo({top:0})};if(matchMedia("(prefers-reduced-motion: reduce)").matches)return sw();setCu("in");setTimeout(()=>{sw();setCu("out")},460);setTimeout(()=>setCu(""),1100)};
  const pg=useRef();
  useEffect(()=>{let cur=null;const on=e=>{const t=e.target;if(!t.closest)return;const s=t.closest(".card,.wcd,.frame,.pc,.gcard,.box,.acc,.steps>div");if(s){const r=s.getBoundingClientRect();s.style.setProperty("--mx",(e.clientX-r.left)+"px");s.style.setProperty("--my",(e.clientY-r.top)+"px")}const b=t.closest(".btn");if(cur&&cur!==b){cur.style.transform="";cur=null}if(b&&!matchMedia("(prefers-reduced-motion: reduce)").matches){const r=b.getBoundingClientRect();b.style.transform="translate("+((e.clientX-r.left-r.width/2)*.12).toFixed(1)+"px,"+((e.clientY-r.top-r.height/2)*.22).toFixed(1)+"px)";cur=b}};addEventListener("pointermove",on);return()=>removeEventListener("pointermove",on)},[]);
  useEffect(()=>{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;let t=0;const run=()=>{t=0;const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;pg.current.style.transform="scaleX("+(h>0?y/h:0)+")";document.body.classList.toggle("sc",y>20);document.querySelectorAll("[data-par]").forEach(el=>{const r=el.parentElement.getBoundingClientRect();el.style.transform="translate3d(0,"+((r.top+r.height/2-innerHeight/2)*parseFloat(el.dataset.par)).toFixed(1)+"px,0)"})};const on=()=>{if(!t)t=requestAnimationFrame(run)};addEventListener("scroll",on,{passive:true});addEventListener("resize",on);const i=setTimeout(run,60);return()=>{removeEventListener("scroll",on);removeEventListener("resize",on);clearTimeout(i)}},[page]);
  const V={accueil:<Home go={go}/>,stic:<Stic/>,je:<JE/>,asso:<Asso/>,activites:<Activites/>}[page];
  return <><div className="prog" ref={pg}/><div className={"curtain "+cu} aria-hidden="true"><img src={LOGO} alt=""/></div><Nav page={page} go={go}/><main key={page}>{V}</main><Footer go={go}/></>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
